[ids]
*

[main]
# Hold Caps = caps layer, tap Caps = normal Caps
capslock = overload(caps, capslock)
# Fn (remapped to Right Alt by applespi fnremap=7) and Right Option = fn layer
rightalt = layer(fn)

[caps]
# Caps + Tab = Escape (MacBook touchbar has no Esc here)
tab = esc

[fn]
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
minus = f11
equal = f12
up = volumeup
down = volumedown
right = brightnessup
left = brightnessdown
backspace = delete
